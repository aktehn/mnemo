name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: ${{ fromJson(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["windows-latest", "macos-latest", "ubuntu-latest"]') }}
        node-version: ${{ fromJson(github.event_name == 'pull_request' && '["20.x"]' || '["20.x", "22.x"]') }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build
      env:
        # Prevent build failures if code strictly checks for these
        VITE_SUPABASE_URL: "https://example.supabase.co"
        VITE_SUPABASE_ANON_KEY: "dummy-key-for-build-process"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.os }}-${{ matrix.node-version }}
        path: release/
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact-windows-latest-*/**/*
          artifact-macos-latest-*/**/*
          artifact-ubuntu-latest-*/**/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
